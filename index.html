<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Test AstronomyAPI (Fixed Endpoint)</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 20px;
      line-height: 1.6;
    }
    #result {
      margin-top: 20px;
      padding: 10px;
      background: #f0f0f0;
      border-radius: 4px;
    }
    button {
      padding: 10px 15px;
      background: #4dabf7;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }
    .error { color: red; }
    .success { color: green; }
  </style>
</head>
<body>
  <h1>Test AstronomyAPI (Fixed Endpoint)</h1>
  <p>Click the button to fetch Mars' current position:</p>
  <button id="fetchBtn">Fetch Mars Position</button>
  <div id="result">Waiting for data...</div>

  <script>
    document.getElementById('fetchBtn').addEventListener('click', async () => {
      const resultDiv = document.getElementById('result');
      resultDiv.textContent = "Fetching data...";
      resultDiv.className = "";

      try {
        // Replace these with your actual credentials
        const applicationId = "547c16ab-87e2-4d9b-b12d-50bc87090749";
        const applicationSecret = "8350220157ef5d0e41a4d3a658558fa1bdea470f52c44822062dae1e0f225068b6baeb73b7a12848b1f21d0ef6798c53af94cca27136308868e5ca05507bff262ca485fd077296ab8ed2fe6fb85715f377cba29ab4b6d7b21727b91252ece5d6234dad273017671129dad9467fd37be1";

        // Create the Basic Auth string
        const authString = btoa(`${applicationId}:${applicationSecret}`);

        // Correct API endpoint for planetary positions
        const apiUrl = "https://api.astronomyapi.com/api/v2/bodies/positions";

        // Request body (specify Mars and date)
        const requestBody = {
          body: "Mars",
          date: "2026-05-15"
        };

        const response = await fetch(apiUrl, {
          method: 'POST', // AstronomyAPI requires POST for this endpoint
          headers: {
            'Authorization': `Basic ${authString}`,
            'Content-Type': 'application/json'
          },
          body: JSON.stringify(requestBody)
        });

        if (!response.ok) {
          throw new Error(`API request failed: ${response.status} ${response.statusText}`);
        }

        const data = await response.json();
        console.log("API Response:", data); // Log the full response for debugging

        // Extract Mars' heliocentric coordinates
        const marsData = data.data; // Check the structure of the response
        resultDiv.innerHTML = `
          <p class="success"><strong>✅ Success! Mars Position:</strong></p>
          <pre>${JSON.stringify(marsData, null, 2)}</pre>
        `;
      } catch (error) {
        resultDiv.textContent = `❌ Error: ${error.message}`;
        resultDiv.className = "error";
        console.error("API Error:", error);
      }
    });
  </script>
</body>
</html>
