<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Test The Sky Live API (Working)</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 20px;
      line-height: 1.6;
    }
    #result {
      margin-top: 20px;
      padding: 10px;
      background: #f0f0f0;
      border-radius: 4px;
    }
    button {
      padding: 10px 15px;
      background: #4dabf7;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }
    .error { color: red; }
    .success { color: green; }
  </style>
</head>
<body>
  <h1>Test The Sky Live API</h1>
  <p>Click the button to fetch Mars' current position:</p>
  <button id="fetchBtn">Fetch Mars Position</button>
  <div id="result">Waiting for data...</div>

  <script>
    document.getElementById('fetchBtn').addEventListener('click', async () => {
      const resultDiv = document.getElementById('result');
      resultDiv.textContent = "Fetching data...";
      resultDiv.className = "";

      try {
        // The Sky Live API (no auth, CORS-friendly)
        const apiUrl = "https://api.theskylive.com/planets/mars";

        const response = await fetch(apiUrl);
        if (!response.ok) {
          throw new Error(`API request failed: ${response.status} ${response.statusText}`);
        }

        const marsData = await response.json();
        resultDiv.innerHTML = `
          <p class="success"><strong>✅ Success! Mars Position:</strong></p>
          <pre>${JSON.stringify(marsData, null, 2)}</pre>
          <p><strong>Right Ascension (RA):</strong> ${marsData.ra}°</p>
          <p><strong>Declination (Dec):</strong> ${marsData.dec}°</p>
          <p><strong>Distance from Earth:</strong> ${marsData.distance} AU</p>
          <p><strong>Constellation:</strong> ${marsData.constellation}</p>
        `;
      } catch (error) {
        resultDiv.textContent = `❌ Error: ${error.message}`;
        resultDiv.className = "error";
        console.error("API Error:", error);
      }
    });
  </script>
</body>
</html>
