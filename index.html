<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Test The Sky Live API (CORS Fixed)</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 20px;
      line-height: 1.6;
    }
    #result {
      margin-top: 20px;
      padding: 10px;
      background: #f0f0f0;
      border-radius: 4px;
    }
    button {
      padding: 10px 15px;
      background: #4dabf7;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }
    .error {
      color: red;
    }
  </style>
</head>
<body>
  <h1>Test The Sky Live API (CORS Fixed)</h1>
  <p>Click the button to fetch Mars' current position:</p>
  <button id="fetchBtn">Fetch Mars Position</button>
  <div id="result">Waiting for data...</div>

  <script>
    document.getElementById('fetchBtn').addEventListener('click', async () => {
      const resultDiv = document.getElementById('result');
      resultDiv.textContent = "Fetching data...";
      resultDiv.className = "";

      try {
        // Use allorigins.win as a CORS proxy
        const proxyUrl = "https://allorigins.win/get?url=";
        const apiUrl = "https://api.theskylive.com/planets/mars";

        const response = await fetch(proxyUrl + encodeURIComponent(apiUrl));
        if (!response.ok) {
          throw new Error(`Proxy request failed: ${response.status}`);
        }
        const proxyData = await response.json();

        // The actual API data is nested in proxyData.contents
        const planetData = JSON.parse(proxyData.contents);

        // Display the data
        resultDiv.innerHTML = `
          <p><strong>✅ Success! Mars Position Data:</strong></p>
          <pre>${JSON.stringify(planetData, null, 2)}</pre>
          <p><strong>Right Ascension (RA):</strong> ${planetData.ra}°</p>
          <p><strong>Declination (Dec):</strong> ${planetData.dec}°</p>
          <p><strong>Distance from Earth:</strong> ${planetData.distance} AU</p>
        `;
      } catch (error) {
        resultDiv.textContent = `❌ Error: ${error.message}`;
        resultDiv.className = "error";
        console.error("API Error:", error);
      }
    });
  </script>
</body>
</html>
