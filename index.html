<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Test The Sky Live API</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 20px;
      line-height: 1.6;
    }
    #result {
      margin-top: 20px;
      padding: 10px;
      background: #f0f0f0;
      border-radius: 4px;
    }
    button {
      padding: 10px 15px;
      background: #4dabf7;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <h1>Test The Sky Live API</h1>
  <p>Click the button to fetch Mars' current position:</p>
  <button id="fetchBtn">Fetch Mars Position</button>
  <div id="result">Waiting for data...</div>

  <script>
    document.getElementById('fetchBtn').addEventListener('click', async () => {
      const resultDiv = document.getElementById('result');
      resultDiv.textContent = "Fetching data...";

      try {
        // Fetch Mars' current position from The Sky Live API
        const response = await fetch("https://api.theskylive.com/planets/mars");
        const data = await response.json();

        // Display the raw data (for debugging)
        resultDiv.innerHTML = `
          <p><strong>Mars Position Data:</strong></p>
          <pre>${JSON.stringify(data, null, 2)}</pre>
          <p><strong>Right Ascension (RA):</strong> ${data.ra}°</p>
          <p><strong>Declination (Dec):</strong> ${data.dec}°</p>
          <p><strong>Distance from Earth:</strong> ${data.distance} AU</p>
        `;
      } catch (error) {
        resultDiv.textContent = `Error: ${error.message}`;
        console.error("API Error:", error);
      }
    });
  </script>
</body>
</html>
